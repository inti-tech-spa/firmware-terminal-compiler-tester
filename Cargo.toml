[workspace]
resolver = "2"
members = [
    "crates/samdebug-core",
    "crates/samdebug-tools",
    "crates/samdebug-project",
    "crates/samdebug-debug",
    "crates/samdebug-tui",
    "crates/samdebug-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/inti-tech-spa/firmware-terminal-compiler-tester"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "4.5.48", features = ["derive"] }
ctrlc = "3.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_ignored = "0.1.10"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.23.0"
thiserror = "2.0.17"
toml = "0.9.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt"] }
url = "2.5.7"
lzma-rs = "0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
