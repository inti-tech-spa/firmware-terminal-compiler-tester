name: Build audited OpenOCD tool bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install release-build dependencies
        run: brew install pkg-config libusb hidapi dylibbundler
      - name: Build and validate bundle
        run: ./scripts/build-openocd-macos-arm64.sh
      - name: Upload candidate for independent audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: samdebug-openocd-0.12.0-darwin-arm64-candidate
          path: |
            dist/samdebug-openocd-0.12.0-darwin-arm64.tar.xz
            dist/samdebug-openocd-0.12.0-darwin-arm64.tar.xz.sha256
            dist/samdebug-openocd-0.12.0-sources.tar.xz
            dist/samdebug-openocd-0.12.0-sources.tar.xz.sha256
          if-no-files-found: error
